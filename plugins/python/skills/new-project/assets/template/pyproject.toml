[project]
name = "{{project_name}}"
version = "0.1.0"
description = "{{project_description}}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dependency-injector>=4.49.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "radon>=6.0.1",
    "ruff>=0.17.3",
    "xenon>=0.9.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{project_name}}"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ANN", "ARG", "PTH", "T20"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["{{project_name}}"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
